title: Legend Builder

tooltip: >-
  Select annotation and/or detail item family instances in the model, then run
  this tool to build a legend-style layout (family graphic + label) in a
  Drafting view. Note: Revit's API cannot place components in a true Legend
  view, so a Drafting view is used.

author: Jacques-Michael Oosthuizen

highlight: new

# Button is only enabled when at least one element is selected.
# This is what keeps the button from being greyed out when a valid selection exists.
context: selection

min_revit_version: 2017
